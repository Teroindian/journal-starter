# EKS cluster for the Journal API (eksctl). Create: eksctl create cluster -f k8s/eks-cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: journal-eks
  region: us-east-1
  version: "1.37" # newest version = longest time on $0.10/h standard support
  tags:
    Project: journal-api
    ManagedBy: eksctl

availabilityZones: ["us-east-1a", "us-east-1b"] # us-east-1e does not support EKS

vpc:
  nat:
    gateway: Disable # no NAT gateway (saves about $33/month); nodes use public subnets

managedNodeGroups:
  - name: ng-small
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    volumeType: gp3
    privateNetworking: false
